name: Update fund ETF chart

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update chart data
        run: python docs/update_fund_etf_data.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update fund ETF chart data"
          file_pattern: docs/fund-etf-data.json docs/fund-etf-chart-app.html docs/fund-etf-chart-app-x.html docs/index.html
